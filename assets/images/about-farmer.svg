<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="600" fill="#f6f3e8" />
  <!-- simple farmer illustration -->
  <g transform="translate(120,80)">
    <!-- hat -->
    <ellipse cx="160" cy="80" rx="120" ry="30" fill="#6b4f2b" />
    <rect x="100" y="80" width="120" height="80" rx="20" fill="#8a5a2b" />
    <!-- face -->
    <circle cx="160" cy="140" r="30" fill="#f1c27d" />
    <!-- body -->
    <rect x="120" y="170" width="80" height="120" rx="20" fill="#6b8a3c" />
    <!-- arms/tools -->
    <rect x="70" y="180" width="50" height="20" rx="10" fill="#8a5a2b" transform="rotate(-20 70 180)" />
    <rect x="210" y="180" width="50" height="20" rx="10" fill="#8a5a2b" transform="rotate(20 210 180)" />
    <!-- ground and rows -->
    <g transform="translate(-40,320)">
      <path d="M0 40 C100 0, 200 80, 400 40 C600 0, 700 80, 800 40 L800 120 L0 120 Z" fill="#e2c36b" />
      <path d="M0 30 C150 -10, 300 90, 800 30" stroke="#c89f4a" stroke-width="6" fill="none" />
      <path d="M0 50 C120 10, 260 110, 800 50" stroke="#b07f33" stroke-width="6" fill="none" />
    </g>
  </g>
</svg>
